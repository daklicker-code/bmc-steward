name: Signieren

# Signiert jede Version ohne eigenen Schlüssel (Sigstore „keyless“ über GitHub-Attestierungen): Das Quellarchiv
# des Tags wird reproduzierbar erzeugt (git archive, unkomprimiert) und von GitHub bescheinigt – welcher Commit,
# welcher Workflow, welches Repository. Die Bescheinigung liegt bei GitHub (Reiter „Attestations“), nicht als
# Release-Anhang: laut Konvention haben Releases keine Anhänge. Prüfen: siehe README, „Verify a release“,
# bzw. tools/verify-release.sh.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandener Versions-Tag, z. B. v3.4.1"
        required: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                 # Sigstore: kurzlebiges Zertifikat für diesen Lauf
      attestations: write             # Bescheinigung im Repository ablegen
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Quellarchiv reproduzierbar erzeugen
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "kein Versions-Tag: $TAG"; exit 1 ;; esac
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null
          mkdir out
          tools/release-archive.sh "$TAG" "out/bmc-steward-$TAG.tar"
          sha256sum out/*.tar
      - name: Bescheinigen (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: out/bmc-steward-${{ env.TAG }}.tar
