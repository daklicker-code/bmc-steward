name: SBOM

# Erzeugt bei jedem Versions-Tag eine Software-Stückliste (CycloneDX, JSON) aus den gepinnten Lock-Dateien.
# Bewusst nur als Workflow-Artefakt (Reiter "Actions"), nicht als Release-Anhang: laut release-konvention.md
# haben Tags und Releases keine Anhänge.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Werkzeug installieren (nur hier, nicht Teil des Programms)
        run: pip install cyclonedx-bom==7.3.0
      - name: SBOM erzeugen (Pflicht- und optionale Abhängigkeiten)
        run: |
          mkdir sbom
          cyclonedx-py requirements requirements.lock --of JSON -o sbom/bmc-steward-core.cdx.json
          cyclonedx-py requirements requirements-optional.lock --of JSON -o sbom/bmc-steward-optional.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom/
