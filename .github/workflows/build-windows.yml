name: Build Windows EXE

on:
  workflow_dispatch:        # manuell über den "Actions"-Tab startbar
  push:
    tags:
      - "v*"                # bei Tag v2.0.0 etc. zusätzlich als Release-Asset

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          pip install -r requirements.txt
          pip install PyQt6-WebEngine pyte
          pip install pyinstaller

      - name: EXE bauen
        run: pyinstaller --onefile --windowed --name bmc-steward bmc-steward.py

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bmc-steward-windows
          path: dist/bmc-steward.exe

      - name: An Release anhängen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bmc-steward.exe
