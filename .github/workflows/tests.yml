name: Tests & Audit

permissions:
  contents: read

on:
  workflow_dispatch:        # manuell über den "Actions"-Tab startbar
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen      # headless, kein Display nötig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Systemprogramme (Qt-Offscreen-Bibliotheken + Scanner-Hilfsprogramme)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            zbar-tools tesseract-ocr tesseract-ocr-eng
          # openssl ist auf dem Runner bereits vorhanden

      - name: Python-Abhängigkeiten (exakt gepinnt, nur mit passenden Hashes)
        run: pip install --require-hashes -r requirements.lock

      - name: Prüfsuite (Unit-Tests + Audit + Fuzzing)
        run: python3 tests/run.py --fuzz 20000
