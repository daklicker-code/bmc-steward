<style>@keyframes sphere{0.00%{stroke-dashoffset:1} 0.00%{stroke-dashoffset:1} 17.50%{stroke-dashoffset:0} 86.31%{stroke-dashoffset:0} 93.75%{stroke-dashoffset:1} 100.00%{stroke-dashoffset:1}}@keyframes fill{0.00%{opacity:0} 12.50%{opacity:0} 22.50%{opacity:1} 84.19%{opacity:1} 88.44%{opacity:0} 100.00%{opacity:0}}@keyframes traces{0.00%{stroke-dashoffset:1} 20.00%{stroke-dashoffset:1} 27.50%{stroke-dashoffset:0} 82.06%{stroke-dashoffset:0} 85.25%{stroke-dashoffset:1} 100.00%{stroke-dashoffset:1}}@keyframes dots{0.00%{opacity:0} 26.00%{opacity:0} 31.00%{opacity:1} 80.58%{opacity:1} 82.70%{opacity:0} 100.00%{opacity:0}}@keyframes chip{0.00%{stroke-dashoffset:1} 29.00%{stroke-dashoffset:1} 38.00%{stroke-dashoffset:0} 77.60%{stroke-dashoffset:0} 81.42%{stroke-dashoffset:1} 100.00%{stroke-dashoffset:1}}@keyframes pins{0.00%{stroke-dashoffset:1} 37.00%{stroke-dashoffset:1} 44.00%{stroke-dashoffset:0} 75.05%{stroke-dashoffset:0} 78.03%{stroke-dashoffset:1} 100.00%{stroke-dashoffset:1}}@keyframes check{0.00%{stroke-dashoffset:1} 45.00%{stroke-dashoffset:1} 50.00%{stroke-dashoffset:0} 72.50%{stroke-dashoffset:0} 74.62%{stroke-dashoffset:1} 100.00%{stroke-dashoffset:1}}@keyframes eyes{0.00%{opacity:0} 45.00%{opacity:0} 50.00%{opacity:1} 72.50%{opacity:1} 74.62%{opacity:0} 100.00%{opacity:0}}@keyframes glow{0%{opacity:0} 45.00%{opacity:0} 50.00%{opacity:1} 55.62%{opacity:.7} 61.25%{opacity:.32} 72.50%{opacity:0} 100%{opacity:0}}.a{animation-duration:8000ms;animation-iteration-count:infinite;animation-timing-function:ease-in-out}.d{stroke-dasharray:1 2;fill:none}.sphere{animation-name:sphere}.fill{animation-name:fill}.traces{animation-name:traces}.dots{animation-name:dots}.chip{animation-name:chip}.pins{animation-name:pins}.check{animation-name:check}.eyes{animation-name:eyes}.glow{animation-name:glow}@media (prefers-reduced-motion:reduce){.a{animation:none}.glow{opacity:0}}</style>
